# =============================================================================
# CarSentinel 360 · iOS 手机端工程定义（XcodeGen）
#
# 仓库根就是这一层（project.yml 和 .github/ 都在根）。
# 源码在 ios/CarSentinel/，.xcodeproj 由 `xcodegen generate` 生成、不入库。
#
# ⚠️ 本工程用了 Aurora UI 的 iOS 18（Tab）和 iOS 26（glassEffect /
#    GlassEffectContainer / ToolbarSpacer）资产，必须用 Xcode 26+ 编译
#    （SDK 里没有这些符号时 @available 救不了）。CI 用 macos-15 挑最新 Xcode。
# =============================================================================
name: CarSentinel
options:
  bundleIdPrefix: com.carsentinel
  deploymentTarget:
    iOS: "16.4"          # 不要低于 16.4（用到了 presentationBackground / presentationCornerRadius）
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  CarSentinel:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: ios/CarSentinel
        excludes:
          - "Resources/Info.plist"
    info:
      path: ios/CarSentinel/Resources/Info.plist
      properties:
        CFBundleDisplayName: 360哨兵
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        # 视频观看端，四个方向都支持
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iOS 14+ 访问本地网络（UDP 广播发现 + TCP 取流）必须声明用途
        NSLocalNetworkUsageDescription: 用于发现同一 WiFi 下的车机，并接收它的实时摄像头画面。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carsentinel.phone
        PRODUCT_NAME: CarSentinel
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: 360哨兵

# XcodeGen 不会自动生成 scheme，CI 里 `xcodebuild -scheme CarSentinel` 必须有它
schemes:
  CarSentinel:
    build:
      targets:
        CarSentinel: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
